meta:
  plan_name: alpha101_subset_v1
  status: confirmed
  feature_construction: ohlcv_default
  target:
    task: binary_direction
    entry_price: t_plus_1_open
    settle_price: t_plus_6_open
    horizon_minutes: 5
  objective:
    primary: validate_public_formula_adaptation
    secondary: compare_with_alpha158_and_flow
    break_even_winrate: 0.5882
  note: "single-series alpha101-inspired subset; excludes cross-sectional rank, industry neutralization and multi-asset-only formulas"

global_params:
  eps: 1.0e-12

factors:
  - name: alpha101_price_volume_rel
    family: public_formula_adaptation
    source: alpha101_subset_v1
    enabled: true
    status: confirmed
    params:
      window: [3, 5, 8, 13, 21, 34]
    rationale: "adapted price-volume correlation and covariance formulas"

  - name: alpha101_delay_rank_decay
    family: public_formula_adaptation
    source: alpha101_subset_v1
    enabled: true
    status: confirmed
    params:
      rank_window: [5, 8, 13, 21]
      delta_window: [1, 3, 5]
      decay_window: [3, 5, 8]
    rationale: "adapted delta, ts-rank and decay-linear formulas"

  - name: alpha101_vwap_volatility
    family: public_formula_adaptation
    source: alpha101_subset_v1
    enabled: true
    status: confirmed
    params:
      zscore_window: [5, 8, 13, 21, 34]
      short_window: [3, 5, 8]
      long_window: [13, 21, 34]
    rationale: "adapted VWAP gap, realized-vol ratio and range compression formulas"
