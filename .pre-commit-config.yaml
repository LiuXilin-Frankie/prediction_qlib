repos:
-   repo: local
    hooks:
    -   id: repo-hygiene-paths
        name: block generated data and noisy artifacts
        entry: python3 a6_customizations/repo_hygiene/repo_hygiene.py check-paths
        language: system
        pass_filenames: true
    -   id: repo-hygiene-notebooks
        name: verify staged notebooks are stripped
        entry: python3 a6_customizations/repo_hygiene/repo_hygiene.py check-staged-notebooks
        language: system
        files: \.ipynb$
        pass_filenames: true

-   repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
    -   id: black
        args: ["qlib", "-l 120"]

-   repo: https://github.com/PyCQA/flake8
    rev: 4.0.1
    hooks:
        - id: flake8
          args: ["--ignore=E501,F541,E266,E402,W503,E731,E203"]
